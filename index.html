<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="O portfólio de Rafael San está em atualização. Acompanhe seus trabalhos no Behance e no Instagram.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Rafael San — Portfólio em manutenção</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='44' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
  <style>
    @font-face{font-family:Anton;src:url("assets/fonts/Anton-Regular.ttf") format("truetype");font-style:normal;font-weight:400;font-display:swap}
    @font-face{font-family:Inter;src:url("assets/fonts/Inter-Variable.ttf") format("truetype");font-style:normal;font-weight:100 900;font-display:swap}
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;font-synthesis:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;--accent:#1106ec;background:#000;color:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-width:280px;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    header{padding:clamp(24px,3.333vw,48px) clamp(24px,3.333vw,64px);padding-top:max(clamp(24px,3.333vw,48px),env(safe-area-inset-top))}
    .brand{display:inline-block;font-family:Anton,sans-serif;font-size:48px;line-height:1;letter-spacing:-.01em}
    main{flex:1;display:grid;place-items:center;padding:32px 24px 132px}
    .message{width:100%;max-width:960px;text-align:center}
    .eyebrow{margin:0 0 22px;color:#9c96ff;font-size:14px;font-weight:500;line-height:1.5;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-family:Anton,sans-serif;font-size:clamp(36px,10vw,104px);font-weight:400;line-height:1.06;letter-spacing:.01em;text-transform:uppercase}
    .description{max-width:43ch;margin:26px auto 0;color:#a5a5ad;font-size:clamp(16px,1.5vw,18px);line-height:1.65}
    .social-menu{position:relative;width:min(100%,280px);margin:32px auto 0;text-align:left}
    summary{display:flex;min-height:54px;align-items:center;justify-content:space-between;gap:20px;padding:15px 24px;border:1px solid #ffffff29;border-radius:999px;background:#fff;color:#000;list-style:none;font-size:16px;font-weight:600;line-height:1.4;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .2s ease,color .2s ease,border-color .2s ease}
    summary::-webkit-details-marker{display:none}
    summary:hover,summary:active,.social-menu[open] summary{border-color:var(--accent);background:var(--accent);color:#fff}
    summary svg{flex:none;width:18px;height:18px;transition:transform .25s ease}
    .social-menu[open] summary svg{transform:rotate(45deg)}
    nav{position:absolute;top:calc(100% + 12px);inset-inline:0;z-index:1;display:grid;gap:4px;padding:8px;border:1px solid #ffffff29;border-radius:20px;background:#101012;box-shadow:0 16px 40px #0008}
    nav a{display:flex;min-height:44px;align-items:center;padding:10px 16px;border-radius:12px;color:#eeeef2;text-decoration:none;font-size:16px;line-height:1.5;transition:background .2s ease,color .2s ease}
    nav a:hover,nav a:active{background:#ffffff0d;color:#aaa4ff}
    summary:focus-visible,a:focus-visible{outline:2px solid #aaa4ff;outline-offset:5px}
    footer{padding:0 24px max(24px,env(safe-area-inset-bottom));color:#81818a;text-align:center;font-size:14px;line-height:1.5}
    footer p{margin:0}
    @media(prefers-reduced-motion:no-preference){.message{animation:reveal .75s cubic-bezier(.22,1,.36,1) both}}
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){summary,summary svg,nav a{transition:none}}
  </style>
</head>
<body>
  <header><span class="brand" aria-label="SAN, Rafael San">SAN</span></header>
  <main>
    <div class="message">
      <p class="eyebrow">Rafael San · Portfólio</p>
      <h1>Portfólio<br>em manutenção.</h1>
      <p class="description">Estou atualizando as imagens e os projetos do meu portfólio. Em breve, a versão completa estará disponível.</p>
      <details class="social-menu">
        <summary>Behance / Instagram<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></summary>
        <nav aria-label="Redes sociais">
          <a href="https://www.behance.net/rafaelsanea60f" target="_blank" rel="noopener noreferrer">Behance</a>
          <a href="https://www.instagram.com/nemosanestrela" target="_blank" rel="noopener noreferrer">Instagram</a>
        </nav>
      </details>
    </div>
  </main>
  <footer><p>© SAN 2026</p></footer>
  <script>
    const socialMenu = document.querySelector('.social-menu');
    document.addEventListener('click', event => {
      if (socialMenu.open && !socialMenu.contains(event.target)) socialMenu.open = false;
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && socialMenu.open) {
        socialMenu.open = false;
        socialMenu.querySelector('summary').focus();
      }
    });
  </script>
</body>
</html>
